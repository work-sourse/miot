      color: var(--ink-mute); margin-bottom: 10px;
    }
    .timer { display: flex; justify-content: center; gap: 8px; }
    .timer__cell {
      background: var(--bg); border-radius: 10px;
      border: 1.5px solid rgba(46,95,158,0.18);
      padding: 10px 14px; min-width: 62px; text-align: center;
    }
    .timer__num {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 800; color: var(--warm); line-height: 1;

          <div class="timer__num" id="t-s">00</div>

<script>
  (function() {
    var KEY = 'osteo_record_end';
    var end = localStorage.getItem(KEY);
    if (!end || Date.now() > +end) {
      end = Date.now() + 48 * 3600 * 1000;
      localStorage.setItem(KEY, end);
    }
    function tick() {
      var left = Math.max(0, end - Date.now());
      var h = Math.floor(left / 3600000);
      var m = Math.floor((left % 3600000) / 60000);
      var s = Math.floor((left % 60000) / 1000);
      document.getElementById('t-h').textContent = String(h).padStart(2,'0');
      document.getElementById('t-m').textContent = String(m).padStart(2,'0');
      document.getElementById('t-s').textContent = String(s).padStart(2,'0');
    }
    tick(); setInterval(tick, 1000);
  })();
</script>
