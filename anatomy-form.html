  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --warm:      #2E5F9E;
      --warm-soft: #DDE8F5;
      --accent:    #C07230;
      --ink:       #141C2A;
      --ink-mute:  #7A8FA8;
      --bg:        #F0F3F9;
      --card:      #fff;
    }
    html, body { min-height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .eyebrow {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--warm); background: var(--warm-soft);
      border-radius: 20px; padding: 5px 16px;
      margin-bottom: 20px;
      display: inline-block;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(46,95,158,0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    @media (max-width: 480px) { .card { padding: 28px 18px; } }
    .card__title {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .card__title em { font-style: normal; color: var(--warm); }
    .card__sub {
      font-size: 14px;
      color: var(--ink-mute);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .banner {
      background: var(--bg); border-radius: 16px;
      padding: 22px 18px 20px; margin-bottom: 24px; text-align: center;
    }
    .banner__badge {
      display: inline-block; background: linear-gradient(135deg,#1a3a6b,#2E5F9E); color: #fff;
      border-radius: 12px; padding: 6px 14px; margin-bottom: 14px;
      font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .banner__title {
      font-family: 'Unbounded', sans-serif; font-size: clamp(13px, 3.6vw, 17px); font-weight: 800;
      color: var(--ink); line-height: 1.25; letter-spacing: -0.02em; margin-bottom: 16px;
    }
    .banner__title em { font-style: normal; color: var(--warm); }
    .banner__label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 8px; }
    .banner__timer { display: flex; justify-content: center; align-items: flex-start; gap: 6px; }
    .banner__cell {
      background: var(--card); border: 1.5px solid rgba(46,95,158,0.22); border-radius: 10px;
      padding: 8px 10px; min-width: 58px; box-shadow: 0 2px 8px rgba(46,95,158,0.07);
    }
    .banner__num { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 800; color: var(--warm); line-height: 1; }
    .banner__unit { font-size: 8px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); margin-top: 3px; }
    .banner__sep { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 800; color: rgba(46,95,158,0.25); padding-top: 6px; }
    .form-wrap { text-align: left; }
    .page-foot {
      margin-top: 24px;
      font-size: 12px;
      color: var(--ink-mute);
      text-align: center;
    }
    .page-foot a { color: var(--ink-mute); text-decoration: none; }
    .page-foot a:hover { color: var(--warm); }
  </style>

<body>

  <div class="eyebrow">Запись эфира · Олег Агапэ</div>

  <div class="card">
    <div class="card__title">ЖИВАЯ АНАТОМИЯ</div>
    <p class="card__sub">Заполните форму, чтобы получить доступ к записи</p>
    <div class="banner">
      <div class="banner__badge">Запись эфира · Олег Агапэ</div>
      <div class="banner__title">«<em>ЖИВАЯ АНАТОМИЯ:</em> что на самом деле находится под вашими руками» ✅</div>
      <div class="banner__label">Запись доступна ещё</div>
      <div class="banner__timer">
        <div class="banner__cell"><div class="banner__num" id="b-h">48</div><div class="banner__unit">часов</div></div>
        <div class="banner__sep">:</div>
        <div class="banner__cell"><div class="banner__num" id="b-m">00</div><div class="banner__unit">минут</div></div>
        <div class="banner__sep">:</div>
        <div class="banner__cell"><div class="banner__num" id="b-s">00</div><div class="banner__unit">секунд</div></div>
      </div>
    </div>
    <div class="form-wrap">
      <script id="6da2909eaff57e2eb3689f2b6b09a421924c38e8" src="https://online.agape-course.ru/pl/lite/widget/script?id=1675801" onload="typeof startWidget6da2909eaff57e2eb3689f2b6b09a421924c38e8==='function'&&startWidget6da2909eaff57e2eb3689f2b6b09a421924c38e8()"></script>
    </div>
  </div>

  <script>
    // Тот же таймер, что и на странице записи — значения совпадают
    (function() {
      var KEY = 'anatomy_record_end';
      var end = localStorage.getItem(KEY);
      if (!end || Date.now() > +end) {
        end = Date.now() + 48 * 3600 * 1000;
        localStorage.setItem(KEY, end);
      }
      function pad(n) { return String(n).padStart(2, '0'); }
      function tick() {
        var left = Math.max(0, end - Date.now());
        document.getElementById('b-h').textContent = pad(Math.floor(left / 3600000));
        document.getElementById('b-m').textContent = pad(Math.floor((left % 3600000) / 60000));
        document.getElementById('b-s').textContent = pad(Math.floor((left % 60000) / 1000));
      }
      tick(); setInterval(tick, 1000);
    })();
  </script>
