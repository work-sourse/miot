<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Доступ к записи «Реальная анатомия» | МИОТ</title>
  <meta name="description" content="Запись эфира Олега Агапэ «Реальная анатомия». Почему техники перестают работать и как понимание анатомии помогает находить причины дисфункций. Время просмотра ограничено.">
  <meta name="theme-color" content="#081c32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#081c32;--cyan:#96e6f1;--white:#fff;--body:'Inter',Arial,sans-serif;--display:'Unbounded',Arial,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--white);color:#14283f;font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
    h1,p{margin:0}
    .intro{background:var(--navy);color:var(--white);padding:48px 0 44px}
    .intro-inner{width:min(1180px,calc(100% - 64px));margin-inline:auto}
    .intro-meta{display:flex;align-items:center;flex-wrap:wrap;gap:16px;color:#c2d0de;font-size:.9375rem;margin-bottom:30px}
    .status{display:inline-flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid #8ae5ef65;border-radius:5px;background:#8ae5ef0c;color:var(--cyan);font-size:.875rem;font-weight:600}
    .status::before{content:'';width:6px;height:6px;flex:none;background:currentColor;border-radius:50%}
    h1{font:500 clamp(1.9rem,6vw,4.75rem)/1.14 var(--display);letter-spacing:-.055em;text-transform:uppercase}
    h1 span{display:block;color:var(--cyan)}
    .intro-subtitle{max-width:920px;font-size:clamp(1.125rem,2.15vw,1.6rem);line-height:1.55;margin-top:26px;color:#e2e9f2;text-wrap:pretty}
    .access-note{display:flex;align-items:flex-start;gap:10px;margin-top:28px;color:var(--cyan);font-size:1rem;font-weight:500}
    .access-note svg{width:21px;height:21px;flex:none;margin-top:2px}
    .access-duration{white-space:nowrap}
    #registration-form{width:min(1180px,100%);margin:32px auto 48px}
    @media(max-width:600px){.intro{padding:32px 0}.intro-inner{width:calc(100% - 36px)}.intro-meta{gap:12px;margin-bottom:24px}.intro-subtitle{margin-top:21px}.access-note{margin-top:24px}#registration-form{margin-top:24px}}
  </style>
</head>
<body>
  <header class="intro">
    <div class="intro-inner">
      <div class="intro-meta">
        <span class="status">ЗАПИСЬ ДОСТУПНА</span>
        <span>Эфир Олега Агапэ</span>
      </div>
      <h1>Реальная <span>анатомия</span></h1>
      <p class="intro-subtitle">Почему техники перестают работать и как понимание анатомии помогает находить причины дисфункций</p>
      <p class="access-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span>Время просмотра ограничено — <span class="access-duration">48 часов</span></span>
      </p>
    </div>
  </header>
  <main id="registration-form" data-success-url="https://dr-agape.ru/real-anatomy-record.html">
    <script id="3a11c1d0e385a4cf85411a19211684997d1d6d27" src="https://online.agape-course.ru/pl/lite/widget/script?id=1622629"></script>
  </main>
</body>
</html>
