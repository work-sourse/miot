  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --warm:      #2E5F9E;
      --warm-soft: #DDE8F5;
      --accent:    #C07230;
      --ink:       #141C2A;
      --ink-mute:  #7A8FA8;
      --bg:        #F0F3F9;
      --card:      #fff;
    }
    html, body { min-height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .eyebrow {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--warm); background: var(--warm-soft);
      border-radius: 20px; padding: 5px 16px;
      margin-bottom: 20px;
      display: inline-block;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(46,95,158,0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    @media (max-width: 480px) { .card { padding: 28px 18px; } }
    .card__title {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .card__title em { font-style: normal; color: var(--warm); }
    .card__sub {
      font-size: 14px;
      color: var(--ink-mute);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .access-img { width: 100%; border-radius: 14px; margin-bottom: 24px; display: block; }
    .form-wrap { text-align: left; }
    .page-foot {
      margin-top: 24px;
      font-size: 12px;
      color: var(--ink-mute);
      text-align: center;
    }
    .page-foot a { color: var(--ink-mute); text-decoration: none; }
    .page-foot a:hover { color: var(--warm); }
  </style>
